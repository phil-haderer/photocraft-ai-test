<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fibo Upscale A/B</title>
<style>
:root{--bg:#1b1d21;--panel:#262a30;--fg:#e8eaed;--mut:#9aa0a8;--a:#3b82f6;--b:#f59e0b;--line:#3a3f47}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,Segoe UI,sans-serif}
body{display:flex;flex-direction:column}
#top{display:flex;gap:12px;align-items:flex-start;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.strip{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
.t{width:84px;cursor:pointer;border:2px solid transparent;border-radius:5px;padding:2px;text-align:center;background:var(--bg)}
.t img{display:block;width:100%;height:54px;object-fit:cover;border-radius:3px}
.t span{display:block;font-size:10px;line-height:1.2;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t:hover{border-color:var(--line)}
#ta .t.sel{border-color:var(--a)} #ta .t.sel span{color:var(--a)}
#tb .t.sel{border-color:var(--b)} #tb .t.sel span{color:var(--b)}
.who{font-weight:700;font-size:15px;padding-top:2px}
#ctr{display:flex;flex-direction:column;gap:6px;align-items:center;flex:none}
select,button{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
button.on{background:var(--a);border-color:var(--a);color:#fff}
label{color:var(--mut);font-size:12px}
#main{display:flex;flex:1;min-height:0}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.pane:last-child{border-right:0}
.bar{padding:4px 10px;background:var(--panel);display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);font-size:12px}
.bar b{font-size:14px}.bar .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pa .bar b{color:var(--a)} #pb .bar b{color:var(--b)}
.pr{padding:4px 10px;background:#20232a;color:var(--mut);font-size:11px;line-height:1.35;white-space:pre-wrap;border-bottom:1px solid var(--line);max-height:5.5em;overflow:auto}
.view{flex:1;overflow:auto;background:#000;cursor:grab}
.view img{display:block;max-width:none}
.view.z img{image-rendering:pixelated}
#hint{padding:5px 14px;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
kbd{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
</style></head><body>
<div id="top">
  <div style="display:flex;gap:8px;flex:1;min-width:0"><span class="who" style="color:var(--a)">A</span><div class="strip" id="ta"></div></div>
  <div id="ctr">
    <select id="set"></select>
    <span><button id="m2" class="on">Side by side</button> <button id="m1">Toggle</button></span>
    <span><button id="z100" class="on">100 %</button> <button id="z200">200 %</button> <button id="zfit">Fit</button></span>
    <label><input type="checkbox" id="sync" checked> link scrolling</label>
  </div>
  <div style="display:flex;gap:8px;flex:1;min-width:0;justify-content:flex-end"><div class="strip" id="tb" style="justify-content:flex-end"></div><span class="who" style="color:var(--b)">B</span></div>
</div>
<div id="main">
  <div class="pane" id="pa"><div class="bar"><b>A</b><span class="lb" id="la"></span><span id="za"></span></div><div class="pr" id="pra"></div><div class="view" id="va"><img id="ia"></div></div>
  <div class="pane" id="pb"><div class="bar"><b>B</b><span class="lb" id="lb"></span><span id="zb"></span></div><div class="pr" id="prb"></div><div class="view" id="vb"><img id="ib"></div></div>
</div>
<div id="hint">Click a thumbnail at the top left for A, at the top right for B. Drag or use the wheel to scroll. In Toggle mode <kbd>Space</kbd> or a click switches A/B in place; <kbd>1</kbd> = A, <kbd>2</kbd> = B. Pictures of different size are linked by proportion (the detail matches roughly, not pixel for pixel).</div>
<script>
const SETS = __SETS__;
const $ = id => document.getElementById(id);
let zoom = 1, mode = 2, flip = 'a', syncing = false, fit = false, moved = false, active = 'va', ia = 0, ib = 1;
const sel = $('set');
SETS.forEach((s, i) => sel.add(new Option(s.title, i)));
function strips() {
  const items = SETS[+sel.value].images;
  for (const [id, cur, who] of [['ta', ia, 'a'], ['tb', ib, 'b']]) {
    const el = $(id); el.innerHTML = '';
    items.forEach((it, i) => {
      const d = document.createElement('div'); d.className = 't' + (i === cur ? ' sel' : ''); d.title = it.label;
      d.innerHTML = '<img src="' + it.thumb + '"><span>' + it.short + '</span>';
      d.onclick = () => { if (who === 'a') ia = i; else ib = i; strips(); show(); };
      el.appendChild(d);
    });
  }
}
function load() { const n = SETS[+sel.value].images.length; ia = 0; ib = Math.min(1, n - 1); strips(); show(); }
function setImg(img, sizeEl, lbEl, prEl, it) {
  lbEl.textContent = it.label; prEl.textContent = "Prompt: " + it.prompt;
  img.onload = () => { sizeEl.textContent = img.naturalWidth + ' x ' + img.naturalHeight; apply(); };
  img.src = it.src;
}
function show() {
  const items = SETS[+sel.value].images;
  setImg($('ia'), $('za'), $('la'), $('pra'), items[ia]); setImg($('ib'), $('zb'), $('lb'), $('prb'), items[ib]); layout();
}
function apply() {
  for (const id of ['ia', 'ib']) {
    const img = $(id), v = $(id === 'ia' ? 'va' : 'vb');
    if (fit) { img.style.width = '100%'; img.style.height = 'auto'; }
    else { img.style.width = img.naturalWidth * zoom + 'px'; img.style.height = img.naturalHeight * zoom + 'px'; }
    v.classList.toggle('z', zoom > 1 && !fit);
  }
}
function layout() {
  if (mode === 2) { $('pa').style.display = ''; $('pb').style.display = ''; }
  else { $('pa').style.display = flip === 'a' ? '' : 'none'; $('pb').style.display = flip === 'b' ? '' : 'none'; }
  $('m2').classList.toggle('on', mode === 2); $('m1').classList.toggle('on', mode === 1);
  apply();
}
function frac(v) { return [v.scrollLeft / Math.max(1, v.scrollWidth - v.clientWidth), v.scrollTop / Math.max(1, v.scrollHeight - v.clientHeight)]; }
function setFrac(v, f) { v.scrollLeft = f[0] * (v.scrollWidth - v.clientWidth); v.scrollTop = f[1] * (v.scrollHeight - v.clientHeight); }
for (const [a, b] of [['va', 'vb'], ['vb', 'va']]) {
  $(a).addEventListener('scroll', () => {   // only the pane the user is working in drives the other one (no feedback loop, no jumping)
    if (!$('sync').checked || active !== a) return; setFrac($(b), frac($(a)));
  });
  for (const ev of ['mouseenter', 'mousedown', 'wheel']) $(a).addEventListener(ev, () => { active = a; }, { passive: true });
  let drag = null; const v = $(a);
  v.addEventListener('mousedown', e => { drag = [e.clientX, e.clientY, v.scrollLeft, v.scrollTop]; v.style.cursor = 'grabbing'; moved = false; });
  addEventListener('mouseup', () => { drag = null; v.style.cursor = 'grab'; });
  addEventListener('mousemove', e => { if (!drag) return; moved = true; v.scrollLeft = drag[2] - (e.clientX - drag[0]); v.scrollTop = drag[3] - (e.clientY - drag[1]); });
  v.addEventListener('click', () => { if (mode === 1 && !moved) toggle(); });
}
function toggle() { const f = frac($(flip === 'a' ? 'va' : 'vb')); flip = flip === 'a' ? 'b' : 'a'; layout(); setFrac($(flip === 'a' ? 'va' : 'vb'), f); }
sel.onchange = load;
$('m2').onclick = () => { mode = 2; layout(); }; $('m1').onclick = () => { mode = 1; layout(); };
const zb = (id, z, f) => $(id).onclick = () => { zoom = z; fit = f; for (const k of ['z100', 'z200', 'zfit']) $(k).classList.toggle('on', k === id); apply(); };
zb('z100', 1, false); zb('z200', 2, false); zb('zfit', 1, true);
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); if (mode === 1) toggle(); else { mode = 1; layout(); } }
  if (e.key === '1' && mode === 1 && flip === 'b') toggle(); if (e.key === '2' && mode === 1 && flip === 'a') toggle();
});
load();
</script></body></html>
